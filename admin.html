<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin | Pencalonan MPP 2026</title>
<style>
  :root{
    --navy:#1B2447;--blue:#4C6FE0;--blue-soft:#eaf0ff;--red:#B7373D;
    --ink:#222a44;--muted:#6b7391;--line:#e3e8f5;--ok:#1f8a54;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    min-height:100vh;
    background:radial-gradient(1200px 500px at 50% -200px,#dbe4ff 0%,transparent 70%),
                linear-gradient(180deg,#f4f7ff 0%,#eef2fc 100%);
  }

  /* ===== LOGIN ===== */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-card{
    background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 30px;
    width:100%;max-width:380px;box-shadow:0 10px 30px rgba(27,36,71,.08);text-align:center;
  }
  .login-card img{height:60px;margin-bottom:14px}
  .login-card h1{color:var(--navy);font-size:1.25rem;margin-bottom:4px}
  .login-card p{color:var(--muted);font-size:.85rem;margin-bottom:20px}
  .login-card input{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
    font-size:.95rem;margin-bottom:12px;background:#fbfcff;font-family:inherit;
  }
  .login-card input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(76,111,224,.15)}
  .btn{
    width:100%;padding:13px;border:0;border-radius:12px;cursor:pointer;
    background:var(--navy);color:#fff;font-size:.95rem;font-weight:700;transition:opacity .15s;
  }
  .btn:hover{opacity:.93}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .err{color:var(--red);font-size:.85rem;margin-top:10px;min-height:18px}

  /* ===== DASHBOARD ===== */
  .dash{display:none;max-width:1200px;margin:0 auto;padding:22px 16px 60px}
  .topbar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:16px;
    box-shadow:0 6px 20px rgba(27,36,71,.05);
  }
  .topbar .left{display:flex;align-items:center;gap:12px}
  .topbar img{height:38px}
  .topbar h2{color:var(--navy);font-size:1.05rem;line-height:1.2}
  .topbar .sub{color:var(--muted);font-size:.78rem}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn-sm{padding:9px 16px;border-radius:10px;border:0;cursor:pointer;font-weight:600;font-size:.85rem}
  .btn-csv{background:var(--ok);color:#fff}
  .btn-out{background:#fff;color:var(--red);border:1px solid var(--line)}

  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;flex:1;min-width:130px}
  .stat .n{font-size:1.6rem;font-weight:800;color:var(--navy)}
  .stat .l{font-size:.78rem;color:var(--muted);margin-top:2px}

  .filter{margin-bottom:14px}
  .filter select{
    padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;
    font-size:.88rem;font-family:inherit;color:var(--ink);
  }

  .table-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto;
    box-shadow:0 6px 20px rgba(27,36,71,.05)}
  table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:900px}
  th{background:var(--navy);color:#fff;text-align:left;padding:12px 14px;font-weight:600;white-space:nowrap}
  td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#f8faff}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--blue-soft);
    color:var(--blue);font-weight:600;font-size:.75rem;white-space:nowrap}
  .long{max-width:260px;font-size:.8rem;color:var(--muted)}
  .empty{text-align:center;padding:40px;color:var(--muted)}
  .loading{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>
<body>

<!-- ===== LOGIN VIEW ===== -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <img src="logo.png" alt="TVETMARA PJ" onerror="this.style.display='none'" />
    <h1>Panel Admin MPP</h1>
    <p>Log masuk untuk lihat senarai pencalonan</p>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email admin" required />
      <input type="password" id="pass" placeholder="Kata laluan" required />
      <button type="submit" class="btn" id="loginBtn">Log Masuk</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- ===== DASHBOARD VIEW ===== -->
<div class="dash" id="dashView">
  <div class="topbar">
    <div class="left">
      <img src="tvetmara-pjpng.png" alt="" onerror="this.style.display='none'" />
      <div>
        <h2>Senarai Pencalonan MPP 2026</h2>
        <div class="sub" id="whoami"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-sm btn-csv" id="csvBtn">Export CSV</button>
      <button class="btn-sm btn-out" id="logoutBtn">Log Keluar</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Jumlah Calon</div></div>
    <div class="stat"><div class="n" id="statJawatan">0</div><div class="l">Jawatan Ada Calon</div></div>
  </div>

  <div class="filter">
    <select id="filterJawatan"><option value="">Semua Jawatan</option></select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Nama</th><th>Matrik</th><th>Kelas</th><th>Sem</th>
          <th>Telefon</th><th>Jawatan</th><th>Pengalaman</th><th>Motivasi</th><th>Tarikh</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="10" class="loading">Memuatkan data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { getFirestore, collection, getDocs, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDsx7Q8hL0KuILO20fD1Q6L2w2MtsbF92E",
    authDomain: "mpp-tvetpj-2026.firebaseapp.com",
    projectId: "mpp-tvetpj-2026",
    storageBucket: "mpp-tvetpj-2026.firebasestorage.app",
    messagingSenderId: "347884056492",
    appId: "1:347884056492:web:2b0d8239c0db88f7735409"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  const loginView = document.getElementById("loginView");
  const dashView  = document.getElementById("dashView");
  const loginForm = document.getElementById("loginForm");
  const loginBtn  = document.getElementById("loginBtn");
  const loginErr  = document.getElementById("loginErr");

  let rows = [];   // simpan data mentah utk filter + export

  // ===== AUTH STATE: auto tukar view ikut login status =====
  onAuthStateChanged(auth, (user) => {
    if (user){
      loginView.style.display = "none";
      dashView.style.display  = "block";
      document.getElementById("whoami").textContent = "Log masuk sebagai " + user.email;
      loadData();
    } else {
      loginView.style.display = "grid";
      dashView.style.display  = "none";
    }
  });

  // ===== LOGIN =====
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginErr.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "Sedang log masuk...";
    try {
      await signInWithEmailAndPassword(auth,
        document.getElementById("email").value.trim(),
        document.getElementById("pass").value);
      // onAuthStateChanged akan handle tukar view
    } catch (err){
      loginErr.textContent = "Email atau kata laluan salah.";
      console.error(err.code);
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Log Masuk";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

  // ===== LOAD DATA dari Firestore =====
  async function loadData(){
    const tbody = document.getElementById("tbody");
    try {
      const q = query(collection(db, "pencalonan"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      rows = snap.docs.map(d => d.data());
      buildFilter();
      render(rows);
      document.getElementById("statTotal").textContent = rows.length;
      document.getElementById("statJawatan").textContent =
        new Set(rows.map(r => r.jawatan)).size;
    } catch (err){
      console.error(err);
      tbody.innerHTML = '<tr><td colspan="10" class="empty">Gagal muat data. Cek rules / connection.</td></tr>';
    }
  }

  // ===== isi dropdown filter ikut jawatan yang ada =====
  function buildFilter(){
    const sel = document.getElementById("filterJawatan");
    const list = [...new Set(rows.map(r => r.jawatan))].sort();
    sel.innerHTML = '<option value="">Semua Jawatan</option>' +
      list.map(j => `<option value="${esc(j)}">${esc(j)}</option>`).join("");
    sel.onchange = () => {
      const v = sel.value;
      render(v ? rows.filter(r => r.jawatan === v) : rows);
    };
  }

  // ===== render table =====
  function render(data){
    const tbody = document.getElementById("tbody");
    if (!data.length){
      tbody.innerHTML = '<tr><td colspan="10" class="empty">Tiada rekod.</td></tr>';
      return;
    }
    tbody.innerHTML = data.map((r,i) => `
      <tr>
        <td>${i+1}</td>
        <td>${esc(r.nama)}</td>
        <td>${esc(r.matrik)}</td>
        <td>${esc(r.kelas)}</td>
        <td>${esc(r.semester)}</td>
        <td>${esc(r.telefon)}</td>
        <td><span class="badge">${esc(r.jawatan)}</span></td>
        <td class="long">${esc(r.pengalaman) || "-"}</td>
        <td class="long">${esc(r.motivasi) || "-"}</td>
        <td>${fmtDate(r.createdAt)}</td>
      </tr>`).join("");
  }

  // ===== EXPORT CSV =====
  document.getElementById("csvBtn").addEventListener("click", () => {
    if (!rows.length) return alert("Tiada data untuk di-export.");
    const headers = ["Nama","Matrik","Kelas","Semester","Telefon","Jawatan","Pengalaman","Motivasi","Tarikh"];
    const lines = [headers.map(csvCell).join(",")];
    rows.forEach(r => {
      lines.push([
        r.nama, r.matrik, r.kelas, r.semester, r.telefon,
        r.jawatan, r.pengalaman, r.motivasi, fmtDate(r.createdAt)
      ].map(csvCell).join(","));
    });
    // \uFEFF = BOM, supaya Excel baca huruf melayu / simbol elok
    const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type:"text/csv;charset=utf-8;"});
    const url  = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "pencalonan-mpp-2026.csv";
    a.click();
    URL.revokeObjectURL(url);
  });

  // ===== helpers =====
  // escape utk CSV: kalau ada koma / petikan / newline, balut dengan " dan double the "
  function csvCell(v){
    const s = (v ?? "").toString();
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }
  // escape utk HTML, elak orang inject markup melalui field borang
  function esc(v){
    return (v ?? "").toString()
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }
  function fmtDate(ts){
    if (ts && ts.toDate) return ts.toDate().toLocaleString("ms-MY");
    return "-";
  }
</script>
</body>
</html>
